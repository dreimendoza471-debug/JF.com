<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JF Savings</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f0fd;--card:#fff;--navy:#14264a;--blue:#2457c5;--line:#d5e0f5;--ink:#16213a;--muted:#5b6a8a;--red:#b3261e;--green:#1b7a45;--field:#fff;--bal:#14264a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1426;--card:#142040;--navy:#cfe0ff;--blue:#5b8cf0;--line:#26365e;--ink:#e6eeff;--muted:#9fb1d6;--red:#ff8a80;--green:#6fdc9c;--field:#0f1a33;--bal:#1b3270}}
:root[data-theme="dark"]{--bg:#0c1426;--card:#142040;--navy:#cfe0ff;--blue:#5b8cf0;--line:#26365e;--ink:#e6eeff;--muted:#9fb1d6;--red:#ff8a80;--green:#6fdc9c;--field:#0f1a33;--bal:#1b3270}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--navy);margin:0 0 .5rem;font-weight:700}
.hidden{display:none!important}
/* floating coins background */
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#7ea6ee);opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}
main,.wrap{position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.5rem;box-shadow:0 8px 24px rgba(20,38,74,.08)}
.logo{width:150px;border-radius:12px;display:block}
label{display:block;font-weight:600;margin:.9rem 0 .3rem;color:var(--navy)}
input{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--field);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,87,197,.25)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:.75rem 1.2rem;background:var(--blue);color:#fff;cursor:pointer;margin-top:1rem;transition:transform .15s,background .2s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(36,87,197,.35)}
button:active{transform:translateY(0) scale(.97)}
button:focus-visible{outline:3px solid #9bbcff;outline-offset:2px}
button.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);margin:0;padding:.45rem .9rem}
button.alt{background:transparent;color:var(--navy);border:1px solid var(--line)}
.err{color:var(--red);font-weight:600;min-height:1.5rem;margin:.6rem 0 0}
/* login */
#login{display:grid;place-items:center;min-height:100vh;padding:1.5rem}
.login-card{width:100%;max-width:420px;text-align:center;animation:pop .7s cubic-bezier(.2,1.2,.4,1) both}
.login-card .logo{margin:0 auto 1rem;width:200px;animation:float 4s ease-in-out infinite}
.login-card form{text-align:left}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes float{50%{transform:translateY(-6px)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* dashboard */
.wrap{max-width:980px;margin:0 auto;padding:1.5rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.top .logo{width:90px}.who{display:flex;align-items:center;gap:.8rem}
.balance{background:linear-gradient(135deg,var(--bal),#2457c5);color:#fff;border-radius:14px;padding:1.75rem 2rem;margin-bottom:1.25rem;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{60%,100%{left:130%}}
.balance p{margin:0;color:#cfe0ff}
.balance strong{display:block;font-family:Georgia,serif;font-size:clamp(2.2rem,8vw,3.6rem);font-weight:400}
.balance.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.03)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:.9rem;margin:.3rem 0 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.9rem}
tr.new{animation:slidein .5s both}
@keyframes slidein{from{opacity:0;transform:translateX(-24px);background:rgba(36,87,197,.2)}}
.dep{color:var(--green);font-weight:600}.wd{color:var(--red);font-weight:600}
/* modal + toast */
dialog{border:0;border-radius:14px;padding:1.5rem;max-width:400px;width:calc(100% - 2rem);background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog[open]{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
dialog::backdrop{background:rgba(10,20,45,.55);backdrop-filter:blur(3px)}
.row{display:flex;gap:.6rem}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--navy);color:var(--card);padding:.8rem 1.3rem;border-radius:30px;font-weight:600;z-index:10;transition:transform .45s cubic-bezier(.2,1.2,.4,1);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

    <h2>Recent activity</h2>
    <p id="empty">No activity yet. Make your first deposit above.</p>
    <div class="scroll"><table id="tbl" class="hidden">
      <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Purpose / note</th><th>By</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
  </section>
</div>

<dialog id="confirm">
  <h2>Confirm withdrawal</h2>
  <p id="confirmText"></p>
  <div class="row">
    <button id="yes">Withdraw</button>
    <button class="alt" id="no" type="button">Cancel</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var USERS={franciose:"Franciose",james:"James"}, PASS="08/08/26", KEY="jf_savings_v1";
  var $=function(id){return document.getElementById(id)};
  var tx=[], user=null, shown=0, pending=null, tTimer;

  function load(){try{tx=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tx=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}}
  function peso(c){return "₱"+(c/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function balance(){return tx.reduce(function(s,t){return s+(t.kind==="deposit"?t.cents:-t.cents)},0)}
  function parse(s){s=(s||"").replace(/,/g,"").trim();if(!/^\d+(\.\d{1,2})?$/.test(s))return null;var c=Math.round(parseFloat(s)*100);return c>0&&c<=1e11?c:null}

  // floating bubbles
  for(var i=0;i<14;i++){var b=document.createElement("i"),z=20+Math.random()*60;
    b.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(12+Math.random()*16)+"s;animation-delay:-"+Math.random()*20+"s";
    $("bubbles").appendChild(b)}

  // animated number count
  function countTo(target){
    var from=shown,start=null,dur=900;
    function step(t){if(!start)start=t;var p=Math.min((t-start)/dur,1),e=1-Math.pow(1-p,3);
      $("balAmt").textContent=peso(Math.round(from+(target-from)*e));
      if(p<1)requestAnimationFrame(step);else shown=target}
    requestAnimationFrame(step);
    $("bal").classList.remove("bump");void $("bal").offsetWidth;$("bal").classList.add("bump");
  }

  function render(newId){
    countTo(balance());
    var rows=$("rows");rows.innerHTML="";
    var list=tx.slice(-25).reverse();
    $("empty").classList.toggle("hidden",list.length>0);
    $("tbl").classList.toggle("hidden",list.length===0);
    list.forEach(function(t){
      var tr=document.createElement("tr");if(t.id===newId)tr.className="new";
      var cells=[new Date(t.id).toLocaleString("en-PH",{dateStyle:"medium",timeStyle:"short"}),
        t.kind==="deposit"?"Deposit":"Withdraw",peso(t.cents),t.purpose||"—",t.by];
      cells.forEach(function(v,i){var td=document.createElement("td");td.textContent=v;
        if(i===1)td.className=t.kind==="deposit"?"dep":"wd";tr.appendChild(td)});
      rows.appendChild(tr)});
  }

  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tTimer);tTimer=setTimeout(function(){t.classList.remove("show")},3200)}
  function fail(id,msg,card){$(id).textContent=msg;var c=card||$(id).closest(".card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}
  function add(kind,cents,purpose){var t={id:Date.now(),kind:kind,cents:cents,purpose:purpose,by:user};tx.push(t);save();render(t.id)}

  function enter(name){
    user=name;try{sessionStorage.setItem("jf_user",name)}catch(e){}
    $("who").textContent=name;$("login").classList.add("hidden");$("app").classList.remove("hidden");
    shown=0;load();render();
  }

  $("loginForm").addEventListener("submit",function(e){
    e.preventDefault();var n=USERS[$("u").value.trim().toLowerCase()];
    if(n&&$("p").value===PASS){$("loginErr").textContent="";enter(n)}
    else fail("loginErr","Wrong username or password. Check both and try again.",$("loginCard"));
  });
  $("logout").addEventListener("click",function(){
    try{sessionStorage.removeItem("jf_user")}catch(e){}
    $("app").classList.add("hidden");$("login").classList.remove("hidden");$("loginForm").reset();user=null;
  });

  $("depForm").addEventListener("submit",function(e){
    e.preventDefault();var c=parse($("da").value);
    if(c===null)return fail("depErr","Enter a deposit amount greater than 0 (up to 2 decimal places).");
    $("depErr").textContent="";add("deposit",c,$("dn").value.trim());
    toast("Deposited "+peso(c));$("depForm").reset();
  });

  $("wdForm").addEventListener("submit",function(e){
    e.preventDefault();var c=parse($("wa").value),p=$("wp").value.trim();
    if(c===null)return fail("wdErr","Enter a withdrawal amount greater than 0 (up to 2 decimal places).");
    if(!p)return fail("wdErr","Say what the money is for before you withdraw.");
    if(c>balance())return fail("wdErr","You can't withdraw more than the "+peso(balance())+" saved.");
    $("wdErr").textContent="";pending={c:c,p:p};
    $("confirmText").textContent="Withdraw "+peso(c)+" for: "+p;
    $("confirm").showModal();
  });
  $("no").addEventListener("click",function(){pending=null;$("confirm").close()});
  $("yes").addEventListener("click",function(){
    $("confirm").close();if(!pending)return;
    add("withdraw",pending.c,pending.p);toast("Withdrew "+peso(pending.c));pending=null;$("wdForm").reset();
  });

  try{var s=sessionStorage.getItem("jf_user");if(s)enter(s)}catch(e){}
})();
</script>
</body>
</html>
